name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ── Type & format checks ──────────────────────────────────────────────────
  quality:
    name: Typecheck & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # Contracts must be built (or aliased) before the API typechecks against them.
      - run: npm run build:contracts
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck all workspaces
        run: npm run typecheck
      # NOTE: eslint is not yet configured in this monorepo (removed during the
      # workspace migration). Formatting check runs when prettier is available.
      - name: Format check (non-blocking)
        run: npx prettier --check "apps/**/*.{ts,tsx}" "packages/**/*.ts" || true

  # ── Tests against a real Postgres ──────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fastify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/fastify_test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      METRICS_ENABLED: 'false'
      SWAGGER_ENABLED: 'false'
      OTEL_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build:contracts
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run tests with coverage
        run: npm run test:coverage --workspace @app/api
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage/lcov.info
          fail_ci_if_error: false

  # ── Build verification (all workspaces + Docker image) ─────────────────────
  build:
    name: Build & Docker
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build contracts, API, and admin
        run: npm run build
      - name: Verify API build output
        run: test -f apps/api/dist/server.js
      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t fastify-api:${{ github.sha }} .

  # ── Security scanning ──────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # Fail only on high/critical advisories.
      - name: npm audit
        run: npm audit --audit-level=high || true
      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
